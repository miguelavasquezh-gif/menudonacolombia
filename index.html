<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doña Colombia – Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-line"></div>
  <h1>Doña <span>Colombia</span></h1>
  <p class="hero-sub" data-en="Colombian Food" data-es="Comida Colombiana">Colombian Food</p>
  <div class="hero-line-bottom"></div>
</div>

<!-- LANGUAGE BAR -->
<div class="lang-bar">
  <span class="lang-label" data-en="Language:" data-es="Idioma:">Language:</span>
  <button class="lang-btn active" id="btnEN" onclick="setLang('en')">EN</button>
  <button class="lang-btn"        id="btnES" onclick="setLang('es')">ES</button>
</div>

<!-- GRID -->
<main class="menu-section">
  <h2 class="menu-title" data-en="Menu" data-es="Menú">Menu</h2>
  <div class="menu-title-line"></div>

  <div class="category-grid" id="categoryGrid">
    <!-- Generado dinámicamente por js/app.js a partir de js/menudata.js -->
  </div>
</main>

<footer>© Doña Colombia · <span data-en="Colombian Food" data-es="Comida Colombiana">Colombian Food</span></footer>

<script src="js/menudata.js"></script>
<script src="js/app.js"></script>

</body>
</html>
